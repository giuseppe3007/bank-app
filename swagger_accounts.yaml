openapi: 3.0.0
info:
  title: Bank App API - Accounts
  description: API per la gestione dei conti bancari
  version: 1.0.0

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  
  schemas:
    Account:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        account_number:
          type: string
          readOnly: true
        account_type:
          type: string
          enum: [checking, savings, investment]
        balance:
          type: string
          format: decimal
          readOnly: true
        currency:
          type: string
          enum: [EUR, USD, GBP]
        is_active:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    
    Transaction:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        transaction_id:
          type: integer
          format: int64
          readOnly: true
        account:
          type: integer
          format: int64
        destination_account:
          type: integer
          format: int64
          nullable: true
        transaction_type:
          type: string
          enum: [deposit, withdrawal, transfer]
        amount:
          type: string
          format: decimal
        description:
          type: string
        timestamp:
          type: string
          format: date-time
          readOnly: true
        balance_after_transaction:
          type: string
          format: decimal
          readOnly: true
    
    AccountList:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
          format: uri
        previous:
          type: string
          nullable: true
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/Account'
    
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string

paths:
  /accounts/:
    get:
      tags:
        - Accounts
      summary: Lista dei conti
      description: Restituisce l'elenco dei conti dell'utente autenticato
      operationId: listAccounts
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Numero di pagina
          required: false
          schema:
            type: integer
            default: 1
        - name: account_type
          in: query
          description: Tipo di conto
          required: false
          schema:
            type: string
            enum: [checking, savings, investment]
      responses:
        '200':
          description: Elenco dei conti ottenuto con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    post:
      tags:
        - Accounts
      summary: Crea un nuovo conto
      description: Crea un nuovo conto bancario per l'utente autenticato
      operationId: createAccount
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - account_type
                - currency
              properties:
                account_type:
                  type: string
                  enum: [checking, savings, investment]
                currency:
                  type: string
                  enum: [EUR, USD, GBP]
                initial_deposit:
                  type: number
                  format: double
                  minimum: 0
      responses:
        '201':
          description: Conto creato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Errore di validazione
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /accounts/{id}/:
    parameters:
      - name: id
        in: path
        description: ID del conto
        required: true
        schema:
          type: integer
          format: int64
    
    get:
      tags:
        - Accounts
      summary: Dettagli di un conto
      description: Restituisce i dettagli di un conto specifico
      operationId: retrieveAccount
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dettagli del conto ottenuti con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Non autorizzato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Conto non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    put:
      tags:
        - Accounts
      summary: Aggiorna un conto
      description: Aggiorna i dettagli di un conto specifico
      operationId: updateAccount
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                account_type:
                  type: string
                  enum: [checking, savings, investment]
                is_active:
                  type: boolean
      responses:
        '200':
          description: Conto aggiornato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Errore di validazione
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Non autorizzato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Conto non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    delete:
      tags:
        - Accounts
      summary: Elimina un conto
      description: Disattiva un conto specifico (non elimina realmente il record)
      operationId: deleteAccount
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Conto eliminato con successo
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Non autorizzato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Conto non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /accounts/{id}/deposit/:
    parameters:
      - name: id
        in: path
        description: ID del conto
        required: true
        schema:
          type: integer
          format: int64
    
    post:
      tags:
        - Accounts
      summary: Effettua un deposito
      description: Deposita fondi su un conto specifico
      operationId: depositFunds
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: number
                  format: double
                  minimum: 0.01
                description:
                  type: string
      responses:
        '200':
          description: Deposito effettuato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          description: Errore di validazione
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Non autorizzato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Conto non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /accounts/{id}/withdraw/:
    parameters:
      - name: id
        in: path
        description: ID del conto
        required: true
        schema:
          type: integer
          format: int64
    
    post:
      tags:
        - Accounts
      summary: Effettua un prelievo
      description: Preleva fondi da un conto specifico
      operationId: withdrawFunds
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: number
                  format: double
                  minimum: 0.01
                description:
                  type: string
      responses:
        '200':
          description: Prelievo effettuato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          description: Errore di validazione o fondi insufficienti
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Non autorizzato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Conto non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /accounts/{id}/transfer/:
    parameters:
      - name: id
        in: path
        description: ID del conto di origine
        required: true
        schema:
          type: integer
          format: int64
    
    post:
      tags:
        - Accounts
      summary: Effettua un trasferimento
      description: Trasferisce fondi da un conto ad un altro
      operationId: transferFunds
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - destination_account
                - amount
              properties:
                destination_account:
                  type: integer
                  format: int64
                amount:
                  type: number
                  format: double
                  minimum: 0.01
                description:
                  type: string
      responses:
        '200':
          description: Trasferimento effettuato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          description: Errore di validazione o fondi insufficienti
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Non autorizzato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Conto non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
