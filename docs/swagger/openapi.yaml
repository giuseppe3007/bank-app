openapi: 3.0.0
info:
  title: Bank App API - Accounts
  description: API per la gestione dei conti bancari
  version: 1.0.0
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Account:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        account_number:
          type: string
          readOnly: true
        account_type:
          type: string
          enum:
          - checking
          - savings
          - investment
        balance:
          type: string
          format: decimal
          readOnly: true
        currency:
          type: string
          enum:
          - EUR
          - USD
          - GBP
        is_active:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    Transaction:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        account:
          type: integer
          format: int64
        destination_account:
          type: integer
          format: int64
          nullable: true
        transaction_type:
          type: string
          enum:
          - deposit
          - withdrawal
          - transfer
        amount:
          type: string
          format: decimal
        description:
          type: string
        timestamp:
          type: string
          format: date-time
          readOnly: true
        balance_after_transaction:
          type: string
          format: decimal
          readOnly: true
    AccountList:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
          format: uri
        previous:
          type: string
          nullable: true
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/Account'
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
    InsurancePolicy:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        policy_number:
          type: string
          readOnly: true
        policy_type:
          type: string
          enum:
          - health
          - life
          - home
          - car
          - travel
        premium_amount:
          type: string
          format: decimal
        coverage_amount:
          type: string
          format: decimal
        status:
          type: string
          enum:
          - pending
          - active
          - expired
          - cancelled
          readOnly: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        linked_account:
          type: integer
          format: int64
        payment_frequency:
          type: string
          enum:
          - monthly
          - quarterly
          - semi_annual
          - annual
        beneficiary:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    InsuranceClaim:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        policy:
          type: integer
          format: int64
        claim_amount:
          type: string
          format: decimal
        claim_reason:
          type: string
        status:
          type: string
          enum:
          - submitted
          - in_review
          - approved
          - rejected
          - paid
          readOnly: true
        submission_date:
          type: string
          format: date-time
          readOnly: true
        decision_date:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        decision_reason:
          type: string
          nullable: true
        payment_date:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        payment_amount:
          type: string
          format: decimal
          nullable: true
          readOnly: true
    InsurancePayment:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        policy:
          type: integer
          format: int64
        amount:
          type: string
          format: decimal
        payment_date:
          type: string
          format: date-time
          readOnly: true
        due_date:
          type: string
          format: date
        payment_method:
          type: string
          enum:
          - account
          - card
          - bank_transfer
        source_account:
          type: integer
          format: int64
          nullable: true
        status:
          type: string
          enum:
          - paid
          - pending
          - failed
          readOnly: true
    InsurancePolicyList:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
          format: uri
        previous:
          type: string
          nullable: true
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/InsurancePolicy'
    InsuranceClaimList:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
          format: uri
        previous:
          type: string
          nullable: true
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/InsuranceClaim'
    InsurancePaymentList:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
          format: uri
        previous:
          type: string
          nullable: true
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/InsurancePayment'
    Investment:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        investment_type:
          type: string
          enum:
          - bonds
          - stocks
          - etf
          - fund
          - deposit
        amount:
          type: string
          format: decimal
        interest_rate:
          type: string
          format: decimal
        term_months:
          type: integer
          minimum: 1
        expected_return:
          type: string
          format: decimal
          readOnly: true
        status:
          type: string
          enum:
          - pending
          - active
          - matured
          - closed
          readOnly: true
        source_account:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        maturity_date:
          type: string
          format: date-time
          nullable: true
          readOnly: true
    InvestmentTransaction:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        investment:
          type: integer
          format: int64
        transaction_type:
          type: string
          enum:
          - deposit
          - withdrawal
          - interest
          - fee
        amount:
          type: string
          format: decimal
        timestamp:
          type: string
          format: date-time
          readOnly: true
        description:
          type: string
        source_account:
          type: integer
          format: int64
          nullable: true
        destination_account:
          type: integer
          format: int64
          nullable: true
    InvestmentList:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
          format: uri
        previous:
          type: string
          nullable: true
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/Investment'
    InvestmentTransactionList:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
          format: uri
        previous:
          type: string
          nullable: true
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/InvestmentTransaction'
    Loan:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        amount:
          type: string
          format: decimal
        term_months:
          type: integer
          minimum: 1
        interest_rate:
          type: string
          format: decimal
        monthly_payment:
          type: string
          format: decimal
          readOnly: true
        total_payment:
          type: string
          format: decimal
          readOnly: true
        remaining_amount:
          type: string
          format: decimal
          readOnly: true
        status:
          type: string
          enum:
          - pending
          - approved
          - active
          - paid
          - rejected
          readOnly: true
        purpose:
          type: string
        linked_account:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        approved_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
    LoanApplication:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        loan:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - pending
          - approved
          - rejected
        application_date:
          type: string
          format: date-time
          readOnly: true
        decision_date:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        decision_reason:
          type: string
          nullable: true
    LoanPayment:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        loan:
          type: integer
          format: int64
        amount:
          type: string
          format: decimal
        payment_date:
          type: string
          format: date-time
          readOnly: true
        payment_method:
          type: string
          enum:
          - account
          - card
          - bank_transfer
        source_account:
          type: integer
          format: int64
          nullable: true
        remaining_balance:
          type: string
          format: decimal
          readOnly: true
    LoanList:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
          format: uri
        previous:
          type: string
          nullable: true
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/Loan'
    LoanApplicationList:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
          format: uri
        previous:
          type: string
          nullable: true
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/LoanApplication'
    LoanPaymentList:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
          format: uri
        previous:
          type: string
          nullable: true
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/LoanPayment'
    TransactionList:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
          format: uri
        previous:
          type: string
          nullable: true
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
paths:
  /accounts/:
    get:
      tags:
      - Accounts
      summary: Lista dei conti
      description: Restituisce l'elenco dei conti dell'utente autenticato
      operationId: listAccounts
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        description: Numero di pagina
        required: false
        schema:
          type: integer
          default: 1
      - name: account_type
        in: query
        description: Tipo di conto
        required: false
        schema:
          type: string
          enum:
          - checking
          - savings
          - investment
      responses:
        '200':
          description: Elenco dei conti ottenuto con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Accounts
      summary: Crea un nuovo conto
      description: Crea un nuovo conto bancario per l'utente autenticato
      operationId: createAccount
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - account_type
              - currency
              properties:
                account_type:
                  type: string
                  enum:
                  - checking
                  - savings
                  - investment
                currency:
                  type: string
                  enum:
                  - EUR
                  - USD
                  - GBP
                initial_deposit:
                  type: number
                  format: double
                  minimum: 0
      responses:
        '201':
          description: Conto creato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Errore di validazione
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /accounts/{id}/:
    parameters:
    - name: id
      in: path
      description: ID del conto
      required: true
      schema:
        type: integer
        format: int64
    get:
      tags:
      - Accounts
      summary: Dettagli di un conto
      description: Restituisce i dettagli di un conto specifico
      operationId: retrieveAccount
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Dettagli del conto ottenuti con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Non autorizzato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Conto non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - Accounts
      summary: Aggiorna un conto
      description: Aggiorna i dettagli di un conto specifico
      operationId: updateAccount
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                account_type:
                  type: string
                  enum:
                  - checking
                  - savings
                  - investment
                is_active:
                  type: boolean
      responses:
        '200':
          description: Conto aggiornato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Errore di validazione
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Non autorizzato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Conto non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Accounts
      summary: Elimina un conto
      description: Disattiva un conto specifico (non elimina realmente il record)
      operationId: deleteAccount
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Conto eliminato con successo
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Non autorizzato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Conto non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /accounts/{id}/deposit/:
    parameters:
    - name: id
      in: path
      description: ID del conto
      required: true
      schema:
        type: integer
        format: int64
    post:
      tags:
      - Accounts
      summary: Effettua un deposito
      description: Deposita fondi su un conto specifico
      operationId: depositFunds
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - amount
              properties:
                amount:
                  type: number
                  format: double
                  minimum: 0.01
                description:
                  type: string
      responses:
        '200':
          description: Deposito effettuato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          description: Errore di validazione
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Non autorizzato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Conto non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /accounts/{id}/withdraw/:
    parameters:
    - name: id
      in: path
      description: ID del conto
      required: true
      schema:
        type: integer
        format: int64
    post:
      tags:
      - Accounts
      summary: Effettua un prelievo
      description: Preleva fondi da un conto specifico
      operationId: withdrawFunds
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - amount
              properties:
                amount:
                  type: number
                  format: double
                  minimum: 0.01
                description:
                  type: string
      responses:
        '200':
          description: Prelievo effettuato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          description: Errore di validazione o fondi insufficienti
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Non autorizzato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Conto non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /accounts/{id}/transfer/:
    parameters:
    - name: id
      in: path
      description: ID del conto di origine
      required: true
      schema:
        type: integer
        format: int64
    post:
      tags:
      - Accounts
      summary: Effettua un trasferimento
      description: Trasferisce fondi da un conto ad un altro
      operationId: transferFunds
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - destination_account
              - amount
              properties:
                destination_account:
                  type: integer
                  format: int64
                amount:
                  type: number
                  format: double
                  minimum: 0.01
                description:
                  type: string
      responses:
        '200':
          description: Trasferimento effettuato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          description: Errore di validazione o fondi insufficienti
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Non autorizzato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Conto non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /insurance-policies/:
    get:
      tags:
      - Insurance
      summary: Lista delle polizze assicurative
      description: Restituisce l'elenco delle polizze assicurative dell'utente autenticato
      operationId: listInsurancePolicies
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        description: Numero di pagina
        required: false
        schema:
          type: integer
          default: 1
      - name: policy_type
        in: query
        description: Tipo di polizza
        required: false
        schema:
          type: string
          enum:
          - health
          - life
          - home
          - car
          - travel
      - name: status
        in: query
        description: Stato della polizza
        required: false
        schema:
          type: string
          enum:
          - pending
          - active
          - expired
          - cancelled
      responses:
        '200':
          description: Elenco delle polizze ottenuto con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsurancePolicyList'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Insurance
      summary: Crea una nuova polizza assicurativa
      description: Crea una nuova polizza assicurativa per l'utente autenticato
      operationId: createInsurancePolicy
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - policy_type
              - premium_amount
              - coverage_amount
              - start_date
              - end_date
              - linked_account
              - payment_frequency
              properties:
                policy_type:
                  type: string
                  enum:
                  - health
                  - life
                  - home
                  - car
                  - travel
                premium_amount:
                  type: number
                  format: double
                  minimum: 1
                coverage_amount:
                  type: number
                  format: double
                  minimum: 1
                start_date:
                  type: string
                  format: date
                end_date:
                  type: string
                  format: date
                linked_account:
                  type: integer
                  format: int64
                payment_frequency:
                  type: string
                  enum:
                  - monthly
                  - quarterly
                  - semi_annual
                  - annual
                beneficiary:
                  type: string
      responses:
        '201':
          description: Polizza creata con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsurancePolicy'
        '400':
          description: Errore di validazione
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /insurance-policies/{id}/:
    parameters:
    - name: id
      in: path
      description: ID della polizza
      required: true
      schema:
        type: integer
        format: int64
    get:
      tags:
      - Insurance
      summary: Dettagli di una polizza
      description: Restituisce i dettagli di una polizza specifica
      operationId: retrieveInsurancePolicy
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Dettagli della polizza ottenuti con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsurancePolicy'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Non autorizzato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Polizza non trovata
          content:
            application/json:
              schema:
