openapi: 3.0.0
info:
  title: Bank App API - Insurance
  description: API per la gestione delle polizze assicurative
  version: 1.0.0

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  
  schemas:
    InsurancePolicy:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        policy_number:
          type: string
          readOnly: true
        policy_type:
          type: string
          enum: [health, life, home, car, travel]
        premium_amount:
          type: string
          format: decimal
        coverage_amount:
          type: string
          format: decimal
        status:
          type: string
          enum: [pending, active, expired, cancelled]
          readOnly: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        linked_account:
          type: integer
          format: int64
        payment_frequency:
          type: string
          enum: [monthly, quarterly, semi_annual, annual]
        beneficiary:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    
    InsuranceClaim:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        policy:
          type: integer
          format: int64
        claim_amount:
          type: string
          format: decimal
        claim_reason:
          type: string
        status:
          type: string
          enum: [submitted, in_review, approved, rejected, paid]
          readOnly: true
        submission_date:
          type: string
          format: date-time
          readOnly: true
        decision_date:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        decision_reason:
          type: string
          nullable: true
        payment_date:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        payment_amount:
          type: string
          format: decimal
          nullable: true
          readOnly: true
    
    InsurancePayment:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        policy:
          type: integer
          format: int64
        amount:
          type: string
          format: decimal
        payment_date:
          type: string
          format: date-time
          readOnly: true
        due_date:
          type: string
          format: date
        payment_method:
          type: string
          enum: [account, card, bank_transfer]
        source_account:
          type: integer
          format: int64
          nullable: true
        status:
          type: string
          enum: [paid, pending, failed]
          readOnly: true
    
    InsurancePolicyList:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
          format: uri
        previous:
          type: string
          nullable: true
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/InsurancePolicy'
    
    InsuranceClaimList:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
          format: uri
        previous:
          type: string
          nullable: true
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/InsuranceClaim'
    
    InsurancePaymentList:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
          format: uri
        previous:
          type: string
          nullable: true
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/InsurancePayment'
    
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string

paths:
  /insurance-policies/:
    get:
      tags:
        - Insurance
      summary: Lista delle polizze assicurative
      description: Restituisce l'elenco delle polizze assicurative dell'utente autenticato
      operationId: listInsurancePolicies
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Numero di pagina
          required: false
          schema:
            type: integer
            default: 1
        - name: policy_type
          in: query
          description: Tipo di polizza
          required: false
          schema:
            type: string
            enum: [health, life, home, car, travel]
        - name: status
          in: query
          description: Stato della polizza
          required: false
          schema:
            type: string
            enum: [pending, active, expired, cancelled]
      responses:
        '200':
          description: Elenco delle polizze ottenuto con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsurancePolicyList'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    post:
      tags:
        - Insurance
      summary: Crea una nuova polizza assicurativa
      description: Crea una nuova polizza assicurativa per l'utente autenticato
      operationId: createInsurancePolicy
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - policy_type
                - premium_amount
                - coverage_amount
                - start_date
                - end_date
                - linked_account
                - payment_frequency
              properties:
                policy_type:
                  type: string
                  enum: [health, life, home, car, travel]
                premium_amount:
                  type: number
                  format: double
                  minimum: 1
                coverage_amount:
                  type: number
                  format: double
                  minimum: 1
                start_date:
                  type: string
                  format: date
                end_date:
                  type: string
                  format: date
                linked_account:
                  type: integer
                  format: int64
                payment_frequency:
                  type: string
                  enum: [monthly, quarterly, semi_annual, annual]
                beneficiary:
                  type: string
      responses:
        '201':
          description: Polizza creata con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsurancePolicy'
        '400':
          description: Errore di validazione
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /insurance-policies/{id}/:
    parameters:
      - name: id
        in: path
        description: ID della polizza
        required: true
        schema:
          type: integer
          format: int64
    
    get:
      tags:
        - Insurance
      summary: Dettagli di una polizza
      description: Restituisce i dettagli di una polizza specifica
      operationId: retrieveInsurancePolicy
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dettagli della polizza ottenuti con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsurancePolicy'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Non autorizzato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Polizza non trovata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    put:
      tags:
        - Insurance
      summary: Aggiorna una polizza
      description: Aggiorna i dettagli di una polizza specifica
      operationId: updateInsurancePolicy
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                premium_amount:
                  type: number
                  format: double
                  minimum: 1
                coverage_amount:
                  type: number
                  format: double
                  minimum: 1
                end_date:
                  type: string
                  format: date
                payment_frequency:
                  type: string
                  enum: [monthly, quarterly, semi_annual, annual]
                beneficiary:
                  type: string
      responses:
        '200':
          description: Polizza aggiornata con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsurancePolicy'
        '400':
          description: Errore di validazione
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Non autorizzato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Polizza non trovata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    delete:
      tags:
        - Insurance
      summary: Cancella una polizza
      description: Cancella una polizza specifica (non elimina realmente il record)
      operationId: cancelInsurancePolicy
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Polizza cancellata con successo
        '400':
          description: Errore nell'operazione di cancellazione
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Non autorizzato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Polizza non trovata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /insurance-claims/:
    get:
      tags:
        - Insurance
      summary: Lista dei sinistri assicurativi
      description: Restituisce l'elenco dei sinistri assicurativi dell'utente autenticato
      operationId: listInsuranceClaims
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Numero di pagina
          required: false
          schema:
            type: integer
            default: 1
        - name: policy
          in: query
          description: ID della polizza
          required: false
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          description: Stato del sinistro
          required: false
          schema:
            type: string
            enum: [submitted, in_review, approved, rejected, paid]
      responses:
        '200':
          description: Elenco dei sinistri ottenuto con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsuranceClaimList'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    post:
      tags:
        - Insurance
      summary: Presenta un nuovo sinistro
      description: Presenta un nuovo sinistro assicurativo per una polizza
      operationId: createInsuranceClaim
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - policy
                - claim_amount
                - claim_reason
              properties:
                policy:
                  type: integer
                  format: int64
                claim_amount:
                  type: number
                  format: double
                  minimum: 0.01
                claim_reason:
                  type: string
      responses:
        '201':
          description: Sinistro presentato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsuranceClaim'
        '400':
          description: Errore di validazione
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /insurance-claims/{id}/:
    parameters:
      - name: id
        in: path
        description: ID del sinistro
        required: true
        schema:
          type: integer
          format: int64
    
    get:
      tags:
        - Insurance
      summary: Dettagli di un sinistro
      description: Restituisce i dettagli di un sinistro specifico
      operationId: retrieveInsuranceClaim
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dettagli del sinistro ottenuti con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsuranceClaim'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Non autorizzato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Sinistro non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /insurance-claims/{id}/approve/:
    parameters:
      - name: id
        in: path
        description: ID del sinistro
        required: true
        schema:
          type: integer
          format: int64
    
    post:
      tags:
        - Insurance
      summary: Approva un sinistro
      description: Approva un sinistro assicurativo (riservato agli amministratori)
      operationId: approveInsuranceClaim
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - payment_amount
              properties:
                payment_amount:
                  type: number
                  format: double
                  minimum: 0.01
                decision_reason:
                  type: string
      responses:
        '200':
          description: Sinistro approvato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsuranceClaim'
        '400':
          description: Errore di validazione
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Non autorizzato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Sinistro non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /insurance-claims/{id}/reject/:
    parameters:
      - name: id
        in: path
        description: ID del sinistro
        required: true
        schema:
          type: integer
          format: int64
    
    post:
      tags:
        - Insurance
      summary: Rifiuta un sinistro
      description: Rifiuta un sinistro assicurativo (riservato agli amministratori)
      operationId: rejectInsuranceClaim
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - decision_reason
              properties:
                decision_reason:
                  type: string
      responses:
        '200':
          description: Sinistro rifiutato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsuranceClaim'
        '400':
          description: Errore di validazione
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Non autorizzato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Sinistro non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /insurance-payments/:
    get:
      tags:
        - Insurance
      summary: Lista dei pagamenti delle polizze
      description: Restituisce l'elenco dei pagamenti effettuati per le polizze
      operationId: listInsurancePayments
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Numero di pagina
          required: false
          schema:
            type: integer
            default: 1
        - name: policy
          in: query
          description: ID della polizza
          required: false
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          description: Stato del pagamento
          required: false
          schema:
            type: string
            enum: [paid, pending, failed]
      responses:
        '200':
          description: Elenco dei pagamenti ottenuto con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsurancePaymentList'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    post:
      tags:
        - Insurance
      summary: Effettua un pagamento
      description: Effettua un pagamento per una polizza assicurativa
      operationId: createInsurancePayment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - policy
                - amount
                - payment_method
                - due_date
              properties:
                policy:
                  type: integer
                  format: int64
                amount:
                  type: number
                  format: double
                  minimum: 0.01
                payment_method:
                  type: string
                  enum: [account, card, bank_transfer]
                source_account:
                  type: integer
                  format: int64
                due_date:
                  type: string
                  format: date
      responses:
        '201':
          description: Pagamento effettuato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsurancePayment'
        '400':
          description: Errore di validazione
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
