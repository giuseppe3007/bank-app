<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Bank App API</title>
  <link rel="stylesheet"
        href="https://unpkg.com/swagger-ui-dist/swagger-ui.css" />
  <style>
    body { margin:0 }
  </style>
</head>
<body>
  <div id="swagger"></div>

  <script src="https://unpkg.com/swagger-ui-dist/swagger-ui-bundle.js"></script>
  <script>
    SwaggerUIBundle({
      url: 'openapi.yaml',     // <-- lo carica dalla stessa cartella
      dom_id: '#swagger',
      docExpansion: 'none',
      deepLinking: true
    })
  </script>
</body>
</html>
