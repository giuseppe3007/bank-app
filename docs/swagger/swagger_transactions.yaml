openapi: 3.0.0
info:
  title: Bank App API - Transactions
  description: API per la gestione delle transazioni bancarie
  version: 1.0.0

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  
  schemas:
    Transaction:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        account:
          type: integer
          format: int64
        destination_account:
          type: integer
          format: int64
          nullable: true
        transaction_type:
          type: string
          enum: [deposit, withdrawal, transfer]
        amount:
          type: string
          format: decimal
        description:
          type: string
        timestamp:
          type: string
          format: date-time
          readOnly: true
        balance_after_transaction:
          type: string
          format: decimal
          readOnly: true
    
    TransactionList:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
          format: uri
        previous:
          type: string
          nullable: true
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
    
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string

paths:
  /transactions/:
    get:
      tags:
        - Transactions
      summary: Lista delle transazioni
      description: Restituisce l'elenco delle transazioni dell'utente autenticato
      operationId: listTransactions
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Numero di pagina
          required: false
          schema:
            type: integer
            default: 1
        - name: account
          in: query
          description: ID del conto
          required: false
          schema:
            type: integer
            format: int64
        - name: transaction_type
          in: query
          description: Tipo di transazione
          required: false
          schema:
            type: string
            enum: [deposit, withdrawal, transfer]
        - name: start_date
          in: query
          description: Data di inizio (formato YYYY-MM-DD)
          required: false
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          description: Data di fine (formato YYYY-MM-DD)
          required: false
          schema:
            type: string
            format: date
        - name: min_amount
          in: query
          description: Importo minimo
          required: false
          schema:
            type: number
            format: double
        - name: max_amount
          in: query
          description: Importo massimo
          required: false
          schema:
            type: number
            format: double
      responses:
        '200':
          description: Elenco delle transazioni ottenuto con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionList'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /transactions/{id}/:
    parameters:
      - name: id
        in: path
        description: ID della transazione
        required: true
        schema:
          type: integer
          format: int64
    
    get:
      tags:
        - Transactions
      summary: Dettagli di una transazione
      description: Restituisce i dettagli di una transazione specifica
      operationId: retrieveTransaction
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dettagli della transazione ottenuti con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Non autorizzato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Transazione non trovata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
