openapi: 3.0.0
info:
  title: Bank App API - Loans
  description: API per la gestione dei prestiti
  version: 1.0.0

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  
  schemas:
    Loan:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        amount:
          type: string
          format: decimal
        term_months:
          type: integer
          minimum: 1
        interest_rate:
          type: string
          format: decimal
        monthly_payment:
          type: string
          format: decimal
          readOnly: true
        total_payment:
          type: string
          format: decimal
          readOnly: true
        remaining_amount:
          type: string
          format: decimal
          readOnly: true
        status:
          type: string
          enum: [pending, approved, active, paid, rejected]
          readOnly: true
        purpose:
          type: string
        linked_account:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        approved_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
    
    LoanApplication:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        loan:
          type: integer
          format: int64
        status:
          type: string
          enum: [pending, approved, rejected]
        application_date:
          type: string
          format: date-time
          readOnly: true
        decision_date:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        decision_reason:
          type: string
          nullable: true
    
    LoanPayment:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        loan:
          type: integer
          format: int64
        amount:
          type: string
          format: decimal
        payment_date:
          type: string
          format: date-time
          readOnly: true
        payment_method:
          type: string
          enum: [account, card, bank_transfer]
        source_account:
          type: integer
          format: int64
          nullable: true
        remaining_balance:
          type: string
          format: decimal
          readOnly: true
    
    LoanList:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
          format: uri
        previous:
          type: string
          nullable: true
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/Loan'
    
    LoanApplicationList:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
          format: uri
        previous:
          type: string
          nullable: true
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/LoanApplication'
    
    LoanPaymentList:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
          format: uri
        previous:
          type: string
          nullable: true
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/LoanPayment'
    
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string

paths:
  /loans/:
    get:
      tags:
        - Loans
      summary: Lista dei prestiti
      description: Restituisce l'elenco dei prestiti dell'utente autenticato
      operationId: listLoans
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Numero di pagina
          required: false
          schema:
            type: integer
            default: 1
        - name: status
          in: query
          description: Stato del prestito
          required: false
          schema:
            type: string
            enum: [pending, approved, active, paid, rejected]
      responses:
        '200':
          description: Elenco dei prestiti ottenuto con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanList'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    post:
      tags:
        - Loans
      summary: Richiede un nuovo prestito
      description: Crea una nuova richiesta di prestito
      operationId: createLoan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
                - term_months
                - interest_rate
                - purpose
                - linked_account
              properties:
                amount:
                  type: number
                  format: double
                  minimum: 100
                term_months:
                  type: integer
                  minimum: 1
                interest_rate:
                  type: number
                  format: double
                purpose:
                  type: string
                linked_account:
                  type: integer
                  format: int64
      responses:
        '201':
          description: Richiesta di prestito creata con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
        '400':
          description: Errore di validazione
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /loans/{id}/:
    parameters:
      - name: id
        in: path
        description: ID del prestito
        required: true
        schema:
          type: integer
          format: int64
    
    get:
      tags:
        - Loans
      summary: Dettagli di un prestito
      description: Restituisce i dettagli di un prestito specifico
      operationId: retrieveLoan
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dettagli del prestito ottenuti con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Non autorizzato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Prestito non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /loans/{id}/apply/:
    parameters:
      - name: id
        in: path
        description: ID del prestito
        required: true
        schema:
          type: integer
          format: int64
    
    post:
      tags:
        - Loans
      summary: Invia richiesta di prestito
      description: Invia ufficialmente una richiesta di prestito per la valutazione
      operationId: applyForLoan
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Richiesta inviata con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanApplication'
        '400':
          description: Errore di validazione
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Non autorizzato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Prestito non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /loans/{id}/approve/:
    parameters:
      - name: id
        in: path
        description: ID del prestito
        required: true
        schema:
          type: integer
          format: int64
    
    post:
      tags:
        - Loans
      summary: Approva un prestito
      description: Approva una richiesta di prestito (riservato agli amministratori)
      operationId: approveLoan
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Prestito approvato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
        '400':
          description: Errore di validazione
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Non autorizzato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Prestito non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /loans/{id}/reject/:
    parameters:
      - name: id
        in: path
        description: ID del prestito
        required: true
        schema:
          type: integer
          format: int64
    
    post:
      tags:
        - Loans
      summary: Rifiuta un prestito
      description: Rifiuta una richiesta di prestito (riservato agli amministratori)
      operationId: rejectLoan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  description: Motivo del rifiuto
      responses:
        '200':
          description: Prestito rifiutato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
        '400':
          description: Errore di validazione
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Non autorizzato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Prestito non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /loan-applications/:
    get:
      tags:
        - Loans
      summary: Lista delle richieste di prestito
      description: Restituisce l'elenco delle richieste di prestito dell'utente autenticato
      operationId: listLoanApplications
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Numero di pagina
          required: false
          schema:
            type: integer
            default: 1
        - name: status
          in: query
          description: Stato della richiesta
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        '200':
          description: Elenco delle richieste ottenuto con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanApplicationList'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /loan-payments/:
    get:
      tags:
        - Loans
      summary: Lista dei pagamenti dei prestiti
      description: Restituisce l'elenco dei pagamenti effettuati sui prestiti
      operationId: listLoanPayments
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Numero di pagina
          required: false
          schema:
            type: integer
            default: 1
        - name: loan
          in: query
          description: ID del prestito
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Elenco dei pagamenti ottenuto con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanPaymentList'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    post:
      tags:
        - Loans
      summary: Effettua un pagamento
      description: Effettua un pagamento su un prestito
      operationId: createLoanPayment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - loan
                - amount
                - payment_method
              properties:
                loan:
                  type: integer
                  format: int64
                amount:
                  type: number
                  format: double
                  minimum: 0.01
                payment_method:
                  type: string
                  enum: [account, card, bank_transfer]
                source_account:
                  type: integer
                  format: int64
      responses:
        '201':
          description: Pagamento effettuato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanPayment'
        '400':
          description: Errore di validazione
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
