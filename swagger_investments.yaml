openapi: 3.0.0
info:
  title: Bank App API - Investments
  description: API per la gestione degli investimenti
  version: 1.0.0

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  
  schemas:
    Investment:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        investment_type:
          type: string
          enum: [bonds, stocks, etf, fund, deposit]
        amount:
          type: string
          format: decimal
        interest_rate:
          type: string
          format: decimal
        term_months:
          type: integer
          minimum: 1
        expected_return:
          type: string
          format: decimal
          readOnly: true
        status:
          type: string
          enum: [pending, active, matured, closed]
          readOnly: true
        source_account:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        maturity_date:
          type: string
          format: date-time
          nullable: true
          readOnly: true
    
    InvestmentTransaction:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        investment:
          type: integer
          format: int64
        transaction_type:
          type: string
          enum: [deposit, withdrawal, interest, fee]
        amount:
          type: string
          format: decimal
        timestamp:
          type: string
          format: date-time
          readOnly: true
        description:
          type: string
        source_account:
          type: integer
          format: int64
          nullable: true
        destination_account:
          type: integer
          format: int64
          nullable: true
    
    InvestmentList:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
          format: uri
        previous:
          type: string
          nullable: true
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/Investment'
    
    InvestmentTransactionList:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
          format: uri
        previous:
          type: string
          nullable: true
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/InvestmentTransaction'
    
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string

paths:
  /investments/:
    get:
      tags:
        - Investments
      summary: Lista degli investimenti
      description: Restituisce l'elenco degli investimenti dell'utente autenticato
      operationId: listInvestments
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Numero di pagina
          required: false
          schema:
            type: integer
            default: 1
        - name: investment_type
          in: query
          description: Tipo di investimento
          required: false
          schema:
            type: string
            enum: [bonds, stocks, etf, fund, deposit]
        - name: status
          in: query
          description: Stato dell'investimento
          required: false
          schema:
            type: string
            enum: [pending, active, matured, closed]
      responses:
        '200':
          description: Elenco degli investimenti ottenuto con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestmentList'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    post:
      tags:
        - Investments
      summary: Crea un nuovo investimento
      description: Crea un nuovo investimento per l'utente autenticato
      operationId: createInvestment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - investment_type
                - amount
                - interest_rate
                - term_months
                - source_account
              properties:
                investment_type:
                  type: string
                  enum: [bonds, stocks, etf, fund, deposit]
                amount:
                  type: number
                  format: double
                  minimum: 1
                interest_rate:
                  type: number
                  format: double
                  minimum: 0
                term_months:
                  type: integer
                  minimum: 1
                source_account:
                  type: integer
                  format: int64
      responses:
        '201':
          description: Investimento creato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Investment'
        '400':
          description: Errore di validazione
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /investments/{id}/:
    parameters:
      - name: id
        in: path
        description: ID dell'investimento
        required: true
        schema:
          type: integer
          format: int64
    
    get:
      tags:
        - Investments
      summary: Dettagli di un investimento
      description: Restituisce i dettagli di un investimento specifico
      operationId: retrieveInvestment
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dettagli dell'investimento ottenuti con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Investment'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Non autorizzato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Investimento non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    put:
      tags:
        - Investments
      summary: Aggiorna un investimento
      description: Aggiorna i dettagli di un investimento specifico
      operationId: updateInvestment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                investment_type:
                  type: string
                  enum: [bonds, stocks, etf, fund, deposit]
                interest_rate:
                  type: number
                  format: double
                  minimum: 0
                term_months:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Investimento aggiornato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Investment'
        '400':
          description: Errore di validazione
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Non autorizzato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Investimento non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    delete:
      tags:
        - Investments
      summary: Chiude un investimento
      description: Chiude un investimento specifico (non elimina realmente il record)
      operationId: closeInvestment
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Investimento chiuso con successo
        '400':
          description: Errore nell'operazione di chiusura
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Non autorizzato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Investimento non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /investment-transactions/:
    get:
      tags:
        - Investments
      summary: Lista delle transazioni di investimento
      description: Restituisce l'elenco delle transazioni di investimento dell'utente autenticato
      operationId: listInvestmentTransactions
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Numero di pagina
          required: false
          schema:
            type: integer
            default: 1
        - name: investment
          in: query
          description: ID dell'investimento
          required: false
          schema:
            type: integer
            format: int64
        - name: transaction_type
          in: query
          description: Tipo di transazione
          required: false
          schema:
            type: string
            enum: [deposit, withdrawal, interest, fee]
      responses:
        '200':
          description: Elenco delle transazioni ottenuto con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestmentTransactionList'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    post:
      tags:
        - Investments
      summary: Crea una nuova transazione di investimento
      description: Aggiunge fondi a un investimento o preleva fondi da un investimento
      operationId: createInvestmentTransaction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - investment
                - transaction_type
                - amount
              properties:
                investment:
                  type: integer
                  format: int64
                transaction_type:
                  type: string
                  enum: [deposit, withdrawal]
                amount:
                  type: number
                  format: double
                  minimum: 0.01
                description:
                  type: string
                source_account:
                  type: integer
                  format: int64
                  description: Richiesto per i depositi
                destination_account:
                  type: integer
                  format: int64
                  description: Richiesto per i prelievi
      responses:
        '201':
          description: Transazione creata con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestmentTransaction'
        '400':
          description: Errore di validazione
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
