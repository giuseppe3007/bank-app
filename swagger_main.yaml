openapi: 3.0.0
info:
  title: Bank App API
  description: API per la gestione di conti bancari, transazioni, prestiti, investimenti e assicurazioni
  version: 1.0.0
  contact:
    email: contact@example.com
servers:
  - url: http://localhost:8000/api
    description: Server di sviluppo
  - url: https://api.bankapp.example.com
    description: Server di produzione

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        username:
          type: string
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
    
    TokenResponse:
      type: object
      properties:
        access:
          type: string
          description: JWT access token
        refresh:
          type: string
          description: JWT refresh token
    
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string

# Paths per autenticazione
paths:
  /token/:
    post:
      tags:
        - Autenticazione
      summary: Ottiene token JWT
      description: Restituisce un token di accesso e un token di refresh
      operationId: obtainToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login effettuato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Credenziali non valide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /token/refresh/:
    post:
      tags:
        - Autenticazione
      summary: Rinnova token JWT
      description: Ottiene un nuovo token di accesso usando il token di refresh
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh
              properties:
                refresh:
                  type: string
      responses:
        '200':
          description: Token rinnovato con successo
          content:
            application/json:
              schema:
                type: object
                properties:
                  access:
                    type: string
        '401':
          description: Token di refresh non valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /token/verify/:
    post:
      tags:
        - Autenticazione
      summary: Verifica token JWT
      description: Verifica la validità di un token JWT
      operationId: verifyToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Token valido
        '401':
          description: Token non valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /register/:
    post:
      tags:
        - Autenticazione
      summary: Registra un nuovo utente
      description: Crea un nuovo account utente
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
                - password
              properties:
                username:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                first_name:
                  type: string
                last_name:
                  type: string
      responses:
        '201':
          description: Utente registrato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Errore di validazione
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /user/:
    get:
      tags:
        - Autenticazione
      summary: Ottiene i dati dell'utente corrente
      description: Restituisce i dati dell'utente autenticato
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dati utente ottenuti con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
